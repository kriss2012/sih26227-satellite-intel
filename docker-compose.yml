version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data       # local satellite archive + vector index
      - ./backend/models:/app/models   # local embedding model weights
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Optional: swap FAISS (file-based, no service) for Qdrant if you want
  # metadata-filtered vector search as a standalone service.
  # qdrant:
  #   image: qdrant/qdrant:v1.11.1
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - ./qdrant_storage:/qdrant/storage
